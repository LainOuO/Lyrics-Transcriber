name: Release

# 打 tag（v*）即发版：三平台并行构建安装包，全部成功后自动创建 GitHub Release
# 并挂上附件。发布说明取 docs/release-notes-v<版本>.md（入库），没有就用兜底文案。
#
#   Windows: Inno Setup 安装包（dist 里改名 LyricsTranscriber-Setup-vX.Y.Z.exe）
#   macOS:   PyInstaller 出 .app，hdiutil 打成 LyricsTranscriber-vX.Y.Z-macOS.dmg
#   Linux:   PyInstaller onedir 组 AppImage，出 LyricsTranscriber-vX.Y.Z-Linux.AppImage
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}  # 形如 v0.6.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"

      - name: 准备 Linux 环境
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libfuse2
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      # ---------------- Windows：Inno Setup 安装包 ----------------
      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          python -m PyInstaller --noconfirm --clean packaging/lyrics_transcriber.spec --distpath dist --workpath build-pyinstaller
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
          # tag 名带 v 前缀，installer.iss 里的版本号不带——拼文件名前先剥掉
          $ver = $env:VERSION -replace '^v', ''
          $src = "dist\installer\歌词提取器-安装包-v$ver.exe"
          $dst = "dist\installer\LyricsTranscriber-Setup-v$ver.exe"
          if (-not (Test-Path $src)) { throw "Inno 没产出预期文件：$src" }
          Move-Item $src $dst
          "附件：$dst"

      # ---------------- macOS：.app → dmg ----------------
      - name: 生成 macOS 图标（icns）
        if: runner.os == 'macOS'
        run: |
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s lyrics_transcriber/assets/app-1024.png --out app.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) lyrics_transcriber/assets/app-1024.png --out app.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns app.iconset -o lyrics_transcriber/assets/app.icns

      - name: 构建 macOS dmg
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean packaging/lyrics_transcriber.spec --distpath dist --workpath build-pyinstaller
          # spec 里的 BUNDLE 段在 darwin 下产出 dist/LyricsTranscriber.app
          test -d dist/LyricsTranscriber.app || { echo "没生成 .app"; ls -R dist | head -30; exit 1; }
          hdiutil create -volname "LyricsTranscriber" \
            -srcfolder dist/LyricsTranscriber.app \
            -ov -format UDZO "dist/LyricsTranscriber-$VERSION-macOS.dmg"

      # ---------------- Linux：onedir → AppImage ----------------
      - name: 构建 Linux AppImage
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean packaging/lyrics_transcriber.spec --distpath dist --workpath build-pyinstaller
          test -x dist/LyricsTranscriber/LyricsTranscriber || { echo "没产出主程序"; exit 1; }
          mkdir -p appdir/usr/bin
          cp -r dist/LyricsTranscriber/* appdir/usr/bin/
          cat > appdir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/LyricsTranscriber/LyricsTranscriber" "$@"
          APPRUN
          chmod +x appdir/AppRun
          cp lyrics_transcriber/assets/app-1024.png appdir/lyricstranscriber.png
          cat > appdir/lyricstranscriber.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=LyricsTranscriber
          Comment=歌词提取器（内嵌/在线/AI 转写，生成 .lrc）
          Icon=lyricstranscriber
          Exec=LyricsTranscriber
          Categories=AudioVideo;Utility;
          DESKTOP
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            appdir "LyricsTranscriber-$VERSION-Linux.AppImage"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.name }}
          path: |
            dist/installer/LyricsTranscriber-Setup-*.exe
            dist/LyricsTranscriber-*-macOS.dmg
            LyricsTranscriber-*-Linux.AppImage
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 准备发布说明
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f "docs/release-notes-v${VER}.md" ]; then
            cp "docs/release-notes-v${VER}.md" /tmp/release-body.md
          else
            echo "歌词提取器 $GITHUB_REF_NAME：Windows / macOS / Linux 安装包见附件。" > /tmp/release-body.md
          fi

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: /tmp/release-body.md
